# BedFight Configuration
# High-performance BedWars plugin

# Storage Configuration
storage:
  # Storage type: "sqlite", "json", "mysql"
  type: "sqlite"
  
  # SQLite settings
  sqlite:
    file: "bedfight.db"
    # WAL mode for better concurrency
    wal_mode: true
    # Busy timeout in ms
    busy_timeout: 5000
  
  # JSON settings (file-based, good for small servers)
  json:
    directory: "data"
    # Pretty print for readability
    pretty_print: false
  
  # MySQL settings
  mysql:
    host: "localhost"
    port: 3306
    database: "bedfight"
    username: "root"
    password: ""
    # Connection pool size
    pool_size: 10
    # Use SSL
    ssl: false

# Game Settings
game:
  # Minimum players to start a game
  min_players: 2
  # Maximum players per team
  max_players_per_team: 4
  # Game timer in seconds
  game_timer: 900
  # Pre-game lobby timer in seconds
  lobby_timer: 30
  # Bed destruction drops items
  bed_drops_items: true
  # Respawn enabled
  respawn_enabled: true
  # Respawn delay in seconds
  respawn_delay: 5
  # Items on respawn
  respawn_items: true
  # Sudden death enabled
  sudden_death: true
  # Sudden death time in seconds
  sudden_death_time: 60

# Arena Settings
arena:
  # Auto-load arenas on startup
  auto_load: true
  # Maximum concurrent arenas
  max_concurrent_arenas: 50
  # Arena cleanup interval in minutes
  cleanup_interval: 30
  # Minimum distance between team spawns
  min_spawn_distance: 20
  # Protection radius around beds
  bed_protection_radius: 3

# Bot Settings
bot:
  # Enable bots
  enabled: true
  # Maximum bots per arena
  max_bots_per_arena: 8
  # Bot spawn delay in ticks
  spawn_delay: 20
  # Bot names pool
  names:
    - "Bot_Alex"
    - "Bot_Steve"
    - "Bot_Herobrine"
    - "Bot_Notch"
    - "Bot_Dinnerbone"
    - "Bot_Jeb"
    - "Bot_Grumm"
    - "Bot_Benny"
    - "Bot_Charlie"
    - "Bot_Delta"
    - "Bot_Echo"
    - "Bot_Foxtrot"
    - "Bot_Golf"
    - "Bot_Hotel"
    - "Bot_India"
  # Difficulty settings
  difficulties:
    noob:
      aim_assist: 0.1
      reaction_time: 800
      build_speed: 0.3
      bridge_speed: 0.2
      combat_skill: 0.1
      pathfinding: "basic"
    player:
      aim_assist: 0.4
      reaction_time: 400
      build_speed: 0.6
      bridge_speed: 0.5
      combat_skill: 0.4
      pathfinding: "advanced"
    pro:
      aim_assist: 0.8
      reaction_time: 100
      build_speed: 1.0
      bridge_speed: 0.9
      combat_skill: 0.9
      pathfinding: "expert"

# Leaderboard Settings
leaderboard:
  # Enable leaderboards
  enabled: true
  # Update interval in minutes
  update_interval: 5
  # Top entries to keep
  top_entries: 100
  # Categories
  categories:
    - "wins"
    - "kills"
    - "beds_destroyed"
    - "games_played"
    - "win_streak"
    - "kdr"

# NPC Settings
npc:
  # Enable NPCs
  enabled: true
  # NPC skin cache time in minutes
  skin_cache_time: 60
  # Maximum NPCs per arena
  max_npcs_per_arena: 20

# Performance Settings
performance:
  # Async task threads
  async_threads: 4
  # Chunk load radius for arenas
  chunk_load_radius: 4
  # Entity tracking range
  entity_tracking_range: 64
  # Particle optimization
  optimize_particles: true
  # Sound optimization
  optimize_sounds: true
  # Database batch size
  db_batch_size: 100
  # Cache TTL in seconds
  cache_ttl: 300

# Messages
