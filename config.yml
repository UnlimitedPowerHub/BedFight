  arena_deleted: "%prefix%§aArena '%arena%' deleted!"
  arena_not_found: "%prefix%§cArena '%arena%' not found!"
  arena_already_exists: "%prefix%§cArena '%arena%' already exists!"
  joined_queue: "%prefix%§aJoined matchmaking queue!"
  left_queue: "%prefix%§cLeft matchmaking queue!"
  game_starting: "%prefix%§eGame starting in %time% seconds..."
  game_started: "%prefix%§aGame started! Good luck!"
  game_ended: "%prefix%§eGame ended! %winner% won!"
  bed_destroyed: "%prefix%§c%player% destroyed %team%'s bed!"
  player_killed: "%prefix%§c%killer% killed %victim%!"
  you_died: "%prefix%§cYou died! Respawning in %time% seconds..."
  respawned: "%prefix%§aYou respawned!"
  not_in_game: "%prefix%§cYou are not in a game!"
  already_in_queue: "%prefix%§cYou are already in the queue!"
  arena_full: "%prefix%§cThis arena is full!"
  setup_mode: "%prefix%§eYou are in setup mode. Use the items to configure the arena."
  setup_complete: "%prefix%§aArena setup complete!"
  setup_cancelled: "%prefix%§cArena setup cancelled!"
  invalid_arena: "%prefix%§cInvalid arena configuration!"
  leaderboard_header: "%prefix%§6=== Top 10 %category% ==="
  leaderboard_entry: "%prefix%§e#%rank% §f%player% §7- §a%value%"
  leaderboard_empty: "%prefix%§cNo data available for this leaderboard."
  npc_created: "%prefix%§aNPC '%name%' created at your location!"
  npc_removed: "%prefix%§aNPC '%name%' removed!"
  bot_added: "%prefix%§aBot '%name%' (%difficulty%) added to arena '%arena%'!"
  bot_removed: "%prefix%§aBot '%name%' removed!"
  welcome: "%prefix%§aWelcome to BedFight! §7Use the BedFight item to join a game."
  about: "%prefix%§6BedFight §7v%version% §8- §eMade by UnlimitedPowerHub\n§7GitHub: §bhttps://github.com/UnlimitedPowerHub"
  duel_soon: "%prefix%§cDuels coming soon!"
  no_arenas_available: "%prefix%§cNo arenas available!"
  not_enough_players: "%prefix%§cNot enough players to start!"
  game_won: "%prefix%§aYou won the game in %arena%!"
  game_lost: "%prefix%§cYou lost! %winner% won in %arena%."
  game_draw: "%prefix%§eGame ended in a draw!"
  eliminated: "%prefix%§cYou have been eliminated!"
  sudden_death: "%prefix%§c§lSUDDEN DEATH! §r§c%time% seconds remaining!"
  time_remaining: "%prefix%§eTime remaining: %time% seconds"
  arena_usage_create: "%prefix%§cUsage: /bfa create <name> [world]"
  arena_usage_delete: "%prefix%§cUsage: /bfa delete <name>"
  arena_usage_setspawn: "%prefix%§cUsage: /bfa setspawn <bluespawn|bluebed|redspawn|redbed> <arena>"
  arena_usage_tp: "%prefix%§cUsage: /bfa tp <arena>"
  bot_usage_add: "%prefix%§cUsage: /bfb add <arena> [difficulty]"
  bot_usage_remove: "%prefix%§cUsage: /bfb remove <name>"
  bot_usage_fill: "%prefix%§cUsage: /bfb fill <arena> [count]"
  npc_usage_remove: "%prefix%§cUsage: /bfn remove <id>"
  npc_usage_tp: "%prefix%§cUsage: /bfn tp <id>"
  config_reloaded: "%prefix%§aConfig reloaded!"

# Items Configuration
items:
  # Lobby items
  lobby:
    - type: "BED"
      name: "§cBed§fFight"
      slot: 0
      lore:
        - "§7Right-click to join a game"
    - type: "IRON_SWORD"
      name: "§eDuel"
      slot: 1
      lore:
        - "§71v1 Duels (Coming Soon)"
    - type: "NAME_TAG"
      name: "§bAbout"
      slot: 8
      lore:
        - "§7Plugin info and credits"

  # Setup items
  setup:
    step1:
      type: "ENDER_PEARL"
      name: "§bSet Blue Spawn"
      slot: 0
    step2:
      type: "BLUE_BED"
      name: "§bSet Blue Bed"
      slot: 0
    step3:
      type: "ENDER_PEARL"
      name: "§cSet Red Spawn"
      slot: 0
    step4:
      type: "RED_BED"
      name: "§cSet Red Bed"
      slot: 0
    step5:
      - type: "EMERALD"
        name: "§aConfirm"
        slot: 0
      - type: "REDSTONE"
        name: "§cCancel"
        slot: 1

  # Game items per team
  game:
    blue:
      - type: "WOODEN_SWORD"
        name: "§bWooden Sword"
        slot: 0
      - type: "BLUE_WOOL"
        name: "§bTeam Wool"
        slot: 1
        amount: 64
      - type: "SHEARS"
        name: "§bShears"
        slot: 2
      - type: "WOODEN_PICKAXE"
        name: "§bPickaxe"
        slot: 3
      - type: "WOODEN_AXE"
        name: "§bAxe"
        slot: 4
    red:
      - type: "WOODEN_SWORD"
        name: "§cWooden Sword"
        slot: 0
      - type: "RED_WOOL"
        name: "§cTeam Wool"
        slot: 1
        amount: 64
      - type: "SHEARS"
        name: "§cShears"
        slot: 2
      - type: "WOODEN_PICKAXE"
        name: "§cPickaxe"
        slot: 3
      - type: "WOODEN_AXE"
        name: "§cAxe"
        slot: 4

# Particles
particles:
  bed_destroy:
    type: "EXPLOSION"
    count: 20
  player_kill:
    type: "HEART"
    count: 10
  win:
    type: "FIREWORK"
    count: 5
  respawn:
    type: "VILLAGER_HAPPY"
    count: 15

# Sounds
sounds:
  join_queue: "random.pop"
  leave_queue: "random.click"
  game_start: "mob.enderdragon.growl"
  game_end: "random.levelup"
  bed_destroy: "random.explode"
  kill: "random.orb"
  death: "mob.zombie.death"
  respawn: "random.pop"
  click: "random.click"